services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      PORT: "5000"
      HOST: "${HOST:-0.0.0.0}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-office@msongorilimited.com}"
      MAIL_TO: "${MAIL_TO:-office@msongorilimited.com}"
      CORS_ORIGIN: "${CORS_ORIGIN:-}"
